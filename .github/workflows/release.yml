name: Instaladores

# Gera os instaladores de Windows e Linux.
# - Ao publicar uma tag "v*" (ex.: v0.2.2), cria uma Release com os arquivos anexados.
# - Também dá para rodar manualmente em Actions > Instaladores > Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Gerar instalador
        shell: cmd
        run: build_instalador_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*-instalador-windows.exe

  linux:
    # Ubuntu 22.04: o executável funciona nessa versão e nas mais novas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar pacote
        run: ./build_instalador_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-linux
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: arquivos/*
          generate_release_notes: true
